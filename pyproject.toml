[project]
name = "dddpy"
version = "2.0.2"
description = "An example of Python FastAPI Domain-Driven Design and Onion Architecture."
authors = [{ name = "iktakahiro", email = "takahiro.ikeuchi@gmail.com" }]
dependencies = [
    "sqlalchemy==2.1.5",
    "fastapi[standard]==0.149.0",
]
readme = "README.md"
requires-python = ">=3.13"

[project.optional-dependencies]
dev = [
    "pyrefly>=1.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
required-version = ">=0.13.4"
package = false
# https://docs.astral.sh/uv/reference/settings/#exclude-newer
exclude-newer = "1 week"
# Exempt certifi (the CA bundle) from the cooldown so trust-store fixes such as
# the emSign CA distrust are picked up immediately.
# https://github.com/certifi/python-certifi/security/advisories/GHSA-6q48-6c7w-9gw2
exclude-newer-package = { certifi = false }

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["dddpy"]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "TID",
    "C4",
    "UP",
    "N",
    "B",
    "C90",
    "TC",
    "ERA",
    "PD",
    "PGH",
    "PL",
    "TRY",
    "PIE",
    "PERF",
]
ignore = ["E501", "B008", "TC003"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.pyrefly]
project_includes = ["main.py", "dddpy"]
